seed: 42
device: cuda
precision: fp32
graph_manifest_dir: /nanolab/libo/lvebpxrd/lvebcsp/dataset/crystal_jepa/splits
output_dir: outputs/crystal_jepa/train_rigid_context_ddp

# Per GPU: 4 GPUs × 80 crystals = 320 crystals per optimizer step.
batch_size: 80
eval_batch_size: 80
num_workers: 8  # Per process, for each loader.
log_every_steps: 20
random_block_geometry: true
context_translation_std: [0.05, 0.75]  # Sample a Gaussian std (angstroms) per crystal.
context_rotation_degrees: [5.0, 90.0]  # Sample an angle; independent axis per molecular copy.
prediction_target: crystal_tokens  # Predict untouched Ct's tokens from the complete perturbed Cc.
max_epochs: 200
learning_rate: 0.0001  # Initial rate; adjusted from validation loss below.
weight_decay: 0.01
gradient_clip_norm: 1.0

d_jepa: 512  # Feature width per token; crystal latents are [B, 32, 512].
crystal_encoder:
  atom_dim: 64
  dim: 256
  output_dim: 512  # Linear projection of each 256-wide token; no global pooling.
  num_latents: 32
  local_layers: 3
  latent_layers: 4
  heads: 8
  radial_basis: 64
  cutoff: 6.0
condition_encoder:
  hidden_dim: 256
predictor:
  type: gated_mlp
  hidden_dim: 512
loss:
  # SIGReg per latent slot: [32, crystal_batch_local, 512] per GPU, on both branches.
  lambda_sig: 0.1
  mu_diff: 0.0  # Difference SIGReg disabled; only per-slot SIGReg remains.
  sigreg_num_projections: 1024
scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 3
  threshold: 0.0001
  threshold_mode: rel
  min_lr: 0.000001
early_stopping:
  patience: 15
packing_eval_samples: 0  # Run the packing evaluator separately after training.
wandb:
  enabled: false
