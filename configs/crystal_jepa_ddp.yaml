seed: 42
device: cuda
precision: auto  # BF16 on supported GPUs, otherwise FP32; SIGReg stays FP32.
graph_manifest_dir: outputs/crystal_jepa/splits
output_dir: outputs/crystal_jepa/train_ddp

# Per GPU: 4 GPUs × 80 crystals = 320 crystals per optimizer step.
batch_size: 80
eval_batch_size: 80
num_workers: 2  # Per process, for each loader.
random_block_geometry: true
max_epochs: 100
learning_rate: 0.0001  # Initial rate; adjusted from validation loss below.
weight_decay: 0.01
gradient_clip_norm: 1.0

stop_gradient: false
d_jepa: 512
crystal_encoder:
  atom_dim: 64
  dim: 256
  output_dim: 512
  num_latents: 32
  local_layers: 3
  latent_layers: 4
  heads: 8
  radial_basis: 32
  cutoff: 6.0
condition_encoder:
  hidden_dim: 256
predictor:
  type: mlp
  hidden_dim: 512
loss:
  lambda_sig: 0.01
  sigreg_num_projections: 1024
scheduler:
  type: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 3
  threshold: 0.0001
  threshold_mode: rel
  min_lr: 0.000001
early_stopping:
  patience: 15
packing_eval_samples: 0  # Run the packing evaluator separately after training.
wandb:
  enabled: false
