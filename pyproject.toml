[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lvebcsp"
version = "0.1.0"
description = "Latent variable energy-based CSP / PXRD alignment"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "torch-geometric",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
